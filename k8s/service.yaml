apiVersion: v1
kind: Service
metadata:
  name: devsecops-app-service
spec:
  type: NodePort
  selector:
    app: devsecops-app
  ports:
    - protocol: TCP
      port: 80         # Cluster internal service port
      targetPort: 8000 # Matches the Docker Gunicorn port
      nodePort: 30080  # Public browser access port (EC2-IP:30080)